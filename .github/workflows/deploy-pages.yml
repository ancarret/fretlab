name: Deploy frontend to GitHub Pages

# Runs after the frontend has already been built and tested by ci.yml on the same push — this
# workflow only produces the GitHub Pages deployment, it does not re-validate the code.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment may run at a time; a newer push should win over one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Uses the github-pages configuration (frontend/angular.json), which swaps in an absolute
      # apiBaseUrl pointing at the Render-hosted backend instead of the relative "/api" the Docker
      # Compose deployment relies on — GitHub Pages has no reverse proxy to make that path work.
      - name: Build
        working-directory: frontend
        run: npm run build:github-pages

      # GitHub Pages serves static files with no server-side rewrite rule like nginx's SPA fallback
      # in the Docker deployment, so a direct load or reload of a deep route (e.g.
      # /practice/fretboard-trainer) would 404. Serving index.html as the 404 page hands the request
      # back to the Angular router, which then resolves the route client-side.
      - name: Add SPA fallback for client-side routing
        run: cp frontend/dist/fretlab-frontend/browser/index.html frontend/dist/fretlab-frontend/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/fretlab-frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
