name: CI

# The master prompt's own pipeline shape: backend compiles and is unit/integration tested, the
# frontend builds and is tested, then both Docker images are proven to actually build — in that
# order, so a broken commit fails at the cheapest possible stage rather than the most expensive.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (compile, unit + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # This repo is developed on Windows with core.filemode=false, so mvnw's executable bit is
      # not reliably preserved in the git object itself — set it explicitly rather than depending
      # on whatever bit happened to be committed.
      - name: Make mvnw executable
        working-directory: backend
        run: chmod +x mvnw

      # `verify` runs unit tests, @WebMvcTest slices and the Testcontainers integration tests
      # together — GitHub's ubuntu runners ship Docker already running, which Testcontainers needs.
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npx ng test --watch=false

  docker:
    name: Docker image build validation
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Proves both Dockerfiles still build clean, without pushing anywhere — actual publishing is
      # a deployment concern (roadmap Phase 15), not something every pull request should do.
      - name: Build backend image
        run: docker build -t fretlab-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t fretlab-frontend:ci ./frontend
