# Render Blueprint for the backend only. The database lives on Supabase/Neon instead of Render's
# free Postgres, which is deleted after 90 days on the free plan — the connection details below are
# entered manually in the Render dashboard for that reason (sync: false), not committed here.
services:
  - type: web
    name: fretlab-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FRETLAB_DB_URL
        sync: false
      - key: FRETLAB_DB_USERNAME
        sync: false
      - key: FRETLAB_DB_PASSWORD
        sync: false
      - key: FRETLAB_CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRETLAB_JWT_SECRET
        generateValue: true
      - key: FRETLAB_JWT_EXPIRATION_MINUTES
        value: '60'
